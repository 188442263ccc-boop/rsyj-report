<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>仁山眼镜回访审核日报</title>
  <style>
    :root {
      --ink: #171717;
      --muted: #6f746f;
      --paper: #f7f5ef;
      --panel: #ffffff;
      --line: #dedbd1;
      --green: #176b54;
      --green-soft: #dcecdf;
      --blue: #2358a8;
      --blue-soft: #dce7f7;
      --coral: #c95844;
      --coral-soft: #f3dfd8;
      --gold: #9a741f;
      --gold-soft: #efe4bd;
      --shadow: 0 18px 50px rgba(38, 36, 28, 0.12);
      color-scheme: light;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        linear-gradient(90deg, rgba(23, 107, 84, 0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(23, 107, 84, 0.07) 1px, transparent 1px),
        var(--paper);
      background-size: 34px 34px;
      color: var(--ink);
    }

    body.locked .shell {
      display: none;
    }

    .auth-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background:
        radial-gradient(circle at 18% 20%, rgba(23, 107, 84, 0.16), transparent 28%),
        linear-gradient(90deg, rgba(23, 107, 84, 0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(23, 107, 84, 0.07) 1px, transparent 1px),
        var(--paper);
      background-size: auto, 34px 34px, 34px 34px;
    }

    .auth-screen[hidden] {
      display: none;
    }

    .auth-card {
      width: min(430px, 100%);
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: clamp(24px, 5vw, 36px);
    }

    .auth-lock {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .auth-card h2 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
    }

    .auth-note {
      margin: 10px 0 24px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .auth-field {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .auth-field label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .auth-field input {
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      color: var(--ink);
      font-size: 15px;
      background: #fff;
    }

    .auth-button {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 6px;
      background: var(--green);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 4px;
    }

    .auth-error {
      min-height: 20px;
      color: var(--coral);
      font-size: 13px;
      margin: 12px 0 0;
    }

    .auth-error[hidden] {
      display: none;
    }

    .shell {
      width: min(1240px, calc(100vw - 36px));
      margin: 0 auto;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 22px;
      align-items: center;
      padding: 28px 0 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      object-fit: cover;
      background: #fff;
      border: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 54px);
      line-height: 0.95;
      letter-spacing: 0;
      font-weight: 860;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .date-control {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    select {
      min-width: 154px;
      height: 40px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 6px;
      color: var(--ink);
      padding: 0 12px;
      font-size: 14px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(310px, 0.95fr);
      gap: 18px;
      align-items: stretch;
      padding: 14px 0 22px;
    }

    .report-panel,
    .stat-strip,
    .table-panel,
    .story-panel {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .report-panel {
      padding: clamp(22px, 3vw, 36px);
      min-height: 360px;
      display: grid;
      align-content: space-between;
      gap: 26px;
      position: relative;
      overflow: hidden;
    }

    .report-panel::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 9px;
      background: linear-gradient(180deg, var(--green), var(--blue), var(--coral));
    }

    .eyebrow {
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .headline {
      margin: 10px 0 0;
      max-width: 760px;
      font-size: clamp(25px, 3.2vw, 44px);
      line-height: 1.08;
      letter-spacing: 0;
      font-weight: 850;
    }

    .summary {
      margin: 18px 0 0;
      color: #444944;
      line-height: 1.9;
      font-size: 15px;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .kpi {
      padding: 18px;
      min-height: 112px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .kpi strong {
      display: block;
      font-size: clamp(30px, 4vw, 54px);
      line-height: 0.95;
      letter-spacing: 0;
      font-weight: 870;
    }

    .kpi span {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .stat-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      overflow: hidden;
      margin-bottom: 22px;
      background: var(--line);
    }

    .strip-item {
      padding: 20px;
      background: rgba(255, 255, 255, 0.94);
    }

    .strip-item span {
      display: block;
      color: var(--muted);
      font-size: 13px;
    }

    .strip-item strong {
      display: block;
      margin-top: 8px;
      font-size: clamp(24px, 2.8vw, 38px);
      line-height: 1;
      letter-spacing: 0;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin: 26px 0 14px;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .store-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .store-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      min-height: 236px;
      box-shadow: 0 10px 30px rgba(38, 36, 28, 0.08);
    }

    .store-card h3 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .store-total {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 18px;
    }

    .store-total strong {
      font-size: 40px;
      line-height: 1;
      letter-spacing: 0;
    }

    .store-total span,
    .metric-label {
      color: var(--muted);
      font-size: 13px;
    }

    .bar {
      height: 10px;
      background: #ece8dd;
      border-radius: 999px;
      overflow: hidden;
      margin: 14px 0 6px;
    }

    .bar i {
      display: block;
      height: 100%;
      width: var(--value);
      background: linear-gradient(90deg, var(--green), var(--blue));
      border-radius: inherit;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      font-size: 13px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .pill.warn {
      background: var(--gold-soft);
      color: var(--gold);
    }

    .table-panel {
      padding: 0;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      background: rgba(247, 245, 239, 0.92);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    td strong {
      display: block;
      line-height: 1.35;
    }

    .score {
      font-variant-numeric: tabular-nums;
      font-weight: 820;
    }

    .story-panel {
      padding: 22px;
      margin: 0 0 38px;
    }

    .story-panel p {
      margin: 0 0 14px;
      color: #3e433e;
      line-height: 1.9;
      font-size: 15px;
    }

    .timeline {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 20px;
    }

    .date-chip {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .date-chip.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    footer {
      padding: 22px 0 36px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 980px) {
      .topbar,
      .hero {
        grid-template-columns: 1fr;
      }

      .date-control {
        justify-content: space-between;
      }

      .store-grid,
      .stat-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .shell {
        width: min(100vw - 24px, 1240px);
      }

      .kpis,
      .store-grid,
      .stat-strip {

      }

      .section-title {
        align-items: start;
        flex-direction: column;
      }

      .hint {
        text-align: left;
      }
    }
  </style>
</head>

  <script id="auth-gate">
    (() => {
      const AUTH_HASH = "97e1f2796d19da80";
      const STORAGE_KEY = "rsyj-report-auth-ok";
      const form = document.getElementById("authForm");
      const userInput = document.getElementById("authUser");
      const passInput = document.getElementById("authPass");
      const error = document.getElementById("authError");
      const screen = document.getElementById("authScreen");

      function gateHash(value) {
        let h1 = 0x811c9dc5;
        let h2 = 0x9e3779b9;
        for (let i = 0; i < value.length; i += 1) {
          const code = value.charCodeAt(i);
          h1 ^= code;
          h1 = Math.imul(h1, 16777619);
          h2 ^= code + i;
          h2 = Math.imul(h2, 1597334677);
        }
        return `${(h1 >>> 0).toString(16).padStart(8, "0")}${(h2 >>> 0).toString(16).padStart(8, "0")}`;
      }

      function unlock() {
        document.body.classList.remove("locked");
        screen.hidden = true;
      }

      function storageGet() {
        try {
          return sessionStorage.getItem(STORAGE_KEY);
        } catch (error) {
          return null;
        }
      }

      function storageSet() {
        try {
          sessionStorage.setItem(STORAGE_KEY, "1");
        } catch (error) {
          // Some local file contexts block storage; login still works for this page view.
        }
      }

      if (storageGet() === "1") {
        unlock();
      } else {
        userInput.focus();
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const user = userInput.value.trim().toLowerCase();
        const pass = passInput.value;
        if (gateHash(`${user}\u0000${pass}`) === AUTH_HASH) {
          storageSet();
          unlock();
          return;
        }
        error.hidden = false;
        passInput.value = "";
        passInput.focus();
      });
    })();
  </script>

  <script>
    const fmt = new Intl.NumberFormat("zh-CN");
    const select = document.getElementById("reportSelect");
    const timeline = document.getElementById("timeline");

    function pct(part, total) {
      if (!total) return 0;
      return Math.round((part / total) * 100);
    }

    function known(value) {
      return Number.isFinite(value);
    }

    function labelForEmployee(emp) {
      if (!emp.total) return ["无待审", ""];
      const completeRate = pct(emp.both, emp.total);
      if (emp.skipped > 0) return ["需复核", "warn"];
      if (completeRate >= 80) return ["记录优秀", ""];
      if (completeRate >= 45) return ["完成较好", ""];
      return ["备注偏少", "warn"];
    }

    function render(report) {
      document.getElementById("reportDate").textContent = `${report.date} · Daily Review`;
      document.getElementById("reportHeadline").textContent = report.headline;
      document.getElementById("reportSummary").textContent = report.summary;
      document.getElementById("updatedAt").textContent = `更新时间：${report.updatedAt}`;
      document.getElementById("statusPill").textContent = report.totals.remaining === 0 ? "已清零" : "有剩余";
      document.getElementById("statusPill").className = report.totals.remaining === 0 ? "pill" : "pill warn";
      const hasActiveFollowups = known(report.totals.activeFollowups);
      const activeCount = hasActiveFollowups ? report.totals.activeFollowups : 0;

      const kpiData = [
        ["审核订单", report.totals.auditedGeneral, "已按规则审核为一般"],
        ["剩余未审", report.totals.remaining, "四店已完成列表回查"],
        ["主动回访", activeCount, hasActiveFollowups ? `${pct(activeCount, report.totals.orders)}%` : "历史未统计"],
        ["图文齐全", report.totals.both, `${pct(report.totals.both, report.totals.orders)}%`]
      ];
      document.getElementById("kpis").innerHTML = kpiData.map(([label, value, sub]) => `
        <div class="kpi">
          <strong>${fmt.format(value)}</strong>
          <span>${label} · ${sub}</span>
        </div>
      `).join("");

      const stripData = [
        ["门店数", report.totals.stores],
        ["总订单", report.totals.orders],
        ["有文字备注", report.totals.withText],
        ["有图片", report.totals.withImages]
      ];
      document.getElementById("statStrip").innerHTML = stripData.map(([label, value]) => `
        <div class="strip-item"><span>${label}</span><strong>${fmt.format(value)}</strong></div>
      `).join("");

      document.getElementById("storeGrid").innerHTML = report.stores.map(store => {
        const completeRate = pct(store.both, store.total);
        return `
          <article class="store-card">
            <h3>${store.name}</h3>
            <div class="store-total"><strong>${fmt.format(store.total)}</strong><span>条订单</span></div>
            <div class="bar" aria-hidden="true"><i style="--value:${completeRate}%"></i></div>
            <div class="metric-label">图文齐全率 ${completeRate}%</div>
            <div class="metric-row"><span>已审一般</span><strong>${fmt.format(store.auditedGeneral)}</strong></div>
            <div class="metric-row"><span>主动回访</span><strong>${known(store.activeFollowups) ? `${fmt.format(store.activeFollowups)} · ${pct(store.activeFollowups, store.total)}%` : "未统计"}</strong></div>
            <div class="metric-row"><span>仅图片</span><strong>${fmt.format(store.imageOnly)}</strong></div>
            <div class="metric-row"><span>跳过</span><strong>${fmt.format(store.skipped)}</strong></div>
          </article>
        `;
      }).join("");

      document.getElementById("activePanel").innerHTML = hasActiveFollowups ? `
        <p>主动回访订单：<strong>${fmt.format(activeCount)}</strong> / ${fmt.format(report.totals.orders)}，占比 <strong>${pct(activeCount, report.totals.orders)}%</strong>。统计口径为回访图片中明确出现主动询问顾客佩戴舒适度、是否需要调整、是否存在佩戴问题，或主动报告加工、到货、质检进度。</p>
        ${report.stores.map(store => `
          <div class="metric-row">
            <span>${store.name}</span>
            <strong>${fmt.format(store.activeFollowups || 0)} / ${fmt.format(store.total)} · ${pct(store.activeFollowups || 0, store.total)}%</strong>
          </div>
        `).join("")}
      ` : `<p>此日期尚未按主动回访口径统计；历史日报数据保留原样。</p>`;

      const employees = report.stores.flatMap(store =>
        store.employees.map(emp => ({ store: store.name, ...emp }))
      );
      document.getElementById("employeeRows").innerHTML = employees.map(emp => {
        const [label, tone] = labelForEmployee(emp);
        return `
          <tr>
            <td>${emp.store}</td>
            <td><strong>${emp.name}</strong><span class="metric-label">${emp.note}</span></td>
            <td class="score">${fmt.format(emp.total)}</td>
            <td class="score">${fmt.format(emp.both)} · ${pct(emp.both, emp.total)}%</td>
            <td class="score">${fmt.format(emp.imageOnly)}</td>
            <td class="score">${fmt.format(emp.textOnly)}</td>
            <td class="score">${known(emp.activeFollowups) ? `${fmt.format(emp.activeFollowups)} · ${pct(emp.activeFollowups, emp.total)}%` : "未统计"}</td>
            <td class="score">${fmt.format(emp.skipped)}</td>
            <td><span class="pill ${tone}">${label}</span></td>
          </tr>
        `;
      }).join("");

      document.getElementById("storyPanel").innerHTML = report.story.map(p => `<p>${p}</p>`).join("");
    }

    function setReport(index) {
      select.value = String(index);
      [...timeline.children].forEach((el, idx) => el.classList.toggle("active", idx === index));
      render(REPORTS[index]);
    }

    REPORTS.forEach((report, index) => {
      const option = document.createElement("option");
      option.value = String(index);
      option.textContent = report.date;
      select.appendChild(option);

      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "date-chip";
      chip.textContent = report.date;
      chip.addEventListener("click", () => setReport(index));
      timeline.appendChild(chip);
    });

    select.addEventListener("change", event => setReport(Number(event.target.value)));
    setReport(0);
  </script>
